name: build

# Builds the extension and runs the tests on Linux, macOS (Apple silicon and Intel) and
# Windows, for each supported Python version, and produces the wheels that release.yml
# uploads to PyPI.
#
# minimal-surface links against the SimpleITK C++ libraries, which nobody wants to compile
# for every job. They come in two ways:
#
# * Windows and macOS: conda-forge ships them, `libsimpleitk` (headers and static SimpleITK
#   libraries) and `libitk-devel` (shared ITK libraries), so each job gets a ready-made SDK in
#   a conda environment and setup.py is pointed at it with SIMPLEITK_PATH. The freshly built
#   wheel still points at the ITK libraries of that environment, so the job then repairs it:
#   delocate (macOS) and delvewheel (Windows) copy the libraries it needs into the wheel.
#
# * Linux: a wheel has to be built against an old glibc and libstdc++ to install on common
#   distributions (manylinux_2_28), and conda-forge's libraries are built against much newer
#   ones. So the linux-sdk job builds static ITK and SimpleITK from source in the manylinux
#   container, once, and caches the result; build-linux builds a wheel for each Python version
#   from the cache and repairs it with auditwheel. Building SimpleITK takes hours, so pull
#   requests never do it: they use the cache when there is one, and otherwise skip the Linux
#   wheels. A push to master, a release or a manual run (workflow_dispatch) builds it when the
#   cache is missing, which only happens when SITK_TAG or build_sdk.sh changes, or after GitHub
#   evicts a cache that was not used for 7 days.
#   The `build` job also builds on Linux with the conda SDK, to check that route (documented in
#   the README), but its wheel is not kept.
#
# Every wheel gets the licenses of the libraries inside it (.github/scripts/licenses.py). The
# test-wheel jobs then install the wheels on a plain Python, without conda, and run the tests,
# which is the check that nothing was left behind.
#
# Also called by release.yml.

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # SimpleITK built from source for the Linux wheels: the same release as the conda-forge
  # libsimpleitk the other platforms use, and so the same ITK.
  SITK_TAG: v2.5.6
  MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64

defaults:
  run:
    # a login shell, so that the micromamba environment is active in every step
    shell: bash -el {0}

jobs:
  # The Python versions to build for. Pull requests only take the oldest and the newest, which
  # keeps the wheels they upload (and the runner time) down; everything else, including a release
  # (release.yml calls this workflow, and `github.event_name` is then `release`), builds all five.
  pythons:
    name: Python versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo 'versions=["3.10","3.14"]' >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["3.10","3.11","3.12","3.13","3.14"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.platform }}, Python ${{ matrix.python }}
    needs: pythons
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
        python: ${{ fromJSON(needs.pythons.outputs.versions) }}
        include:
          - os: ubuntu-latest
            platform: Linux (conda SDK)
            # conda-forge's compilers match the ABI of the libraries in the environment
            toolchain: compilers
            repair: false
          - os: macos-15
            platform: macOS (arm64)
            toolchain: compilers llvm-openmp
            repair: true
          - os: macos-15-intel
            platform: macOS (x86_64)
            toolchain: compilers llvm-openmp
            repair: true
          - os: windows-latest
            platform: Windows
            # the runner's Visual Studio is used
            toolchain: ""
            repair: true

    steps:
      - name: Allow long paths (the vendored Eigen tree has very long file names)
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Point conda's compilers at the macOS SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # clang reads SDKROOT, and older conda compiler packages read CONDA_BUILD_SYSROOT when
          # the environment is activated, so these have to be set before the next step. The
          # conda libraries need macOS 11.
          sdk="$(xcrun --show-sdk-path)"
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
          echo "CONDA_BUILD_SYSROOT=$sdk" >> "$GITHUB_ENV"

      - name: Set up the conda environment with SimpleITK
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: build
          init-shell: bash
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python }}
            libsimpleitk=2.5.*
            libitk-devel
            numpy
            pip
            pytest
            ${{ matrix.toolchain }}

      - name: Build the wheel
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export SIMPLEITK_PATH="$(cygpath -w "$CONDA_PREFIX")"
          else
            export SIMPLEITK_PATH="$CONDA_PREFIX"
          fi
          echo "SimpleITK SDK: $SIMPLEITK_PATH"
          echo "CC=${CC:-} CXX=${CXX:-}"
          python -m pip wheel . --no-deps --wheel-dir dist -v

      # The wheel that is not repaired only works inside this environment, which is all that
      # the Linux job needs it for.
      - name: Install and test
        if: ${{ !matrix.repair }}
        run: |
          python -m pip install --no-deps dist/*.whl
          python -m pytest tests -v

      - name: Bundle the ITK libraries into the wheel
        if: ${{ matrix.repair }}
        run: |
          case "$RUNNER_OS" in
            macOS)
              python -m pip install delocate
              delocate-wheel --wheel-dir wheelhouse --verbose dist/*.whl
              prefix="$CONDA_PREFIX"
              ;;
            Windows)
              python -m pip install delvewheel
              dll_dir="$(cygpath -w "$CONDA_PREFIX/Library/bin")"
              python -m delvewheel show dist/*.whl --add-path "$dll_dir"
              python -m delvewheel repair dist/*.whl --wheel-dir wheelhouse --add-path "$dll_dir"
              prefix="$(cygpath -w "$CONDA_PREFIX")"
              ;;
          esac
          python .github/scripts/licenses.py conda --prefix "$prefix" --wheel wheelhouse/*.whl \
            --eigen src/minimal-surface/code/eigen-3.4.0
          ls -l wheelhouse

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.repair }}
        with:
          name: wheel-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 1

  # Static ITK and SimpleITK for the Linux wheels, built in the manylinux container. The result is
  # cached under a key made from the SimpleITK release and the build script. A job that finds it
  # does nothing, and a pull request that does not find it does not build it (see the header).
  linux-sdk:
    name: Linux SDK (SimpleITK from source)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      available: ${{ steps.sdk.outputs.cache-hit == 'true' || steps.build.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Look for the cached SDK
        id: sdk
        uses: actions/cache/restore@v4
        with:
          path: sdk
          key: linux-sdk-${{ env.SITK_TAG }}-${{ hashFiles('.github/linux/build_sdk.sh') }}
          lookup-only: true

      - name: No cached SDK for this pull request
        if: steps.sdk.outputs.cache-hit != 'true' && github.event_name == 'pull_request'
        run: |
          echo "::warning::There is no cached Linux SDK, so the Linux wheels are skipped. Building SimpleITK takes hours; run this workflow by hand (workflow_dispatch) on the branch, or merge, to build it."

      # ccache keeps the work of a build that fails or is cancelled
      - name: Restore ccache
        if: steps.sdk.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ccache
          key: linux-ccache-${{ env.SITK_TAG }}-${{ github.run_id }}
          restore-keys: linux-ccache-${{ env.SITK_TAG }}-

      - name: Build ITK and SimpleITK
        id: build
        if: steps.sdk.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        run: |
          docker run --rm -v "$PWD:/work" -e SITK_TAG -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)"             "$MANYLINUX_IMAGE" bash /work/.github/linux/build_sdk.sh

      - name: Save the SDK
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: sdk
          key: linux-sdk-${{ env.SITK_TAG }}-${{ hashFiles('.github/linux/build_sdk.sh') }}

      - name: Save ccache
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ccache
          key: linux-ccache-${{ env.SITK_TAG }}-${{ github.run_id }}

  build-linux:
    name: Linux (manylinux_2_28), Python ${{ matrix.python }}
    needs: [pythons, linux-sdk]
    if: ${{ needs.linux-sdk.outputs.available == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.pythons.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore the SDK
        uses: actions/cache/restore@v4
        with:
          path: sdk
          key: linux-sdk-${{ env.SITK_TAG }}-${{ hashFiles('.github/linux/build_sdk.sh') }}
          fail-on-cache-miss: true

      - name: Build the wheel
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          tag="cp${PYTHON//./}-cp${PYTHON//./}"
          docker run --rm -v "$PWD:/work" -e PYTAG="$tag" -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "$MANYLINUX_IMAGE" bash /work/.github/linux/build_wheel.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 1

  # The wheel on a plain Python, with no conda environment (and so none of the libraries the
  # build used) on the machine's search paths.
  test-wheel:
    name: Test the wheel, ${{ matrix.platform }}, Python ${{ matrix.python }}
    needs: [pythons, build]
    # also when another platform's build failed, so that every platform reports its own result
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest]
        python: ${{ fromJSON(needs.pythons.outputs.versions) }}
        include:
          - os: macos-15
            platform: macOS (arm64)
          - os: macos-15-intel
            platform: macOS (x86_64)
          - os: windows-latest
            platform: Windows

    steps:
      - name: Allow long paths (the vendored Eigen tree has very long file names)
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python }}
          path: wheelhouse

      - name: Install and test
        shell: bash
        run: |
          python -m pip install wheelhouse/*.whl numpy pytest
          python -m pytest tests -v

  test-wheel-linux:
    name: Test the wheel, Linux, Python ${{ matrix.python }}
    needs: [pythons, build-linux]
    if: ${{ !cancelled() && needs.build-linux.result != 'skipped' }}
    # the oldest Linux runner, since the wheel is meant to run on older distributions too
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.pythons.outputs.versions) }}

    steps:
      - name: Allow long paths (the vendored Eigen tree has very long file names)
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python }}
          path: wheelhouse

      - name: Install and test
        shell: bash
        run: |
          python -m pip install wheelhouse/*.whl numpy pytest
          python -m pytest tests -v
